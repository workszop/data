  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

  /* ─── Top brand bar ─── */
  .edu-header {
    position: sticky; top: 0; z-index: 50; width: 100%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .edu-header-inner {
    max-width: 1600px; margin: 0 auto;
    padding: 6px clamp(16px, 2.5vw, 40px); display: flex; align-items: center; gap: 12px;
  }
  .edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
  .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }

  /* ─── Layout shell ─── */
  main { max-width: 1600px; margin: 0 auto; padding: 36px clamp(16px, 2.5vw, 40px) 64px; }

  /* ─── Page header ─── */
  .page-head { text-align: center; margin-bottom: 8px; }
  .app-title {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.8rem, 3.5vw, 2.5rem); letter-spacing: -.025em;
    line-height: 1.05; color: var(--ink); margin: 0;
  }

  /* ─── Filters (segmented toggle) ─── */
  .toolbar { display: flex; justify-content: center; margin: 22px 0 6px; }
  .edu-seg { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
  .edu-seg button {
    border: none; background: transparent; padding: 6px 12px; border-radius: var(--r-pill);
    font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .edu-seg button:hover { color: var(--ink); }
  .edu-seg button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
  .edu-seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* ─── Category sections ─── */
  .cat-section { margin-top: 30px; }
  .cat-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 4px; }
  .cat-title { font-family: var(--font-display); font-weight: 600; font-size: var(--h3); color: var(--ink); margin: 0; }
  .cat-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
  .cat-action { margin-left: auto; align-self: center; }
  .cat-desc { font-family: var(--font-sans); font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin: 0 0 12px; }
  .cat-section > .grid { margin-top: 10px; }
  .cat-desc + .grid { margin-top: 0; }

  /* ─── Grid of file cards ─── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; } }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left;
    padding: 0; border-radius: var(--r-md); font: inherit; color: inherit;
    transition: box-shadow .2s cubic-bezier(.32,.72,.32,1), border-color .2s;
  }
  .card:hover { box-shadow: var(--shadow-md); border-color: var(--line-2); }
  .card:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .card-head {
    height: 58px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .head-blue   { background: var(--blue);       color: var(--blue-ink); }
  .head-green  { background: var(--green);      color: var(--green-ink); }
  .head-yellow { background: var(--yellow);     color: var(--yellow-ink); }
  .head-grape  { background: var(--play-grape); color: var(--surface); }
  .head-red    { background: var(--red);        color: var(--red-ink); }
  .head-berry  { background: var(--play-berry); color: var(--surface); }
  .head-ink    { background: var(--ink);        color: var(--yellow); }

  .card-glyph { font-family: var(--font-display); font-weight: 700; font-size: 20px; z-index: 1; letter-spacing: .02em; }
  .card-glyph-ghost {
    position: absolute; right: -10px; bottom: -24px; font-family: var(--font-display);
    font-weight: 800; font-size: 78px; opacity: .16; line-height: 1; user-select: none;
  }
  .card-chip {
    position: absolute; top: 7px; left: 8px; z-index: 2;
    font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .08em; padding: 3px 8px; border-radius: var(--r-pill);
    background: var(--surface); color: var(--ink);
  }

  .card-body { padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-name { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); word-break: break-all; }
  .card-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink); line-height: 1.25; }
  .card-blurb { font-family: var(--font-sans); font-size: 12.5px; line-height: 1.4; color: var(--ink-2); margin: 0; }
  .card-meta { margin-top: auto; padding-top: 5px; display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }

  /* ─── Modal ─── */
  .overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(33,30,26,.46); backdrop-filter: blur(3px);
    align-items: flex-start; justify-content: center; padding: 5vh 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
    width: min(860px, 100%); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 16px; }
  .modal-head-text { flex: 1; min-width: 0; }
  .modal-cat { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); margin: 0 0 6px; }
  .modal-title { font-family: var(--font-mono); font-size: 16px; color: var(--ink); margin: 0; word-break: break-all; }
  .modal-title.is-display { font-family: var(--font-display); font-weight: 700; font-size: 22px; word-break: normal; }
  .modal-blurb { font-family: var(--font-sans); font-size: 14px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.5; }
  .modal-close {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: var(--r-pill); border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); font-size: 18px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: background-color .15s, color .15s, border-color .15s;
  }
  .modal-close:hover { background: var(--red-soft); color: var(--red-ink); border-color: var(--red); }

  .modal-actions { padding: 14px 26px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .edu-btn {
    font-family: var(--font-display); font-weight: 600; font-size: 14px;
    background: var(--yellow); color: var(--on-primary); border: none; text-decoration: none;
    border-radius: var(--r-pill); padding: 11px 20px; box-shadow: var(--shadow-primary);
    cursor: pointer; transition: background-color .15s, transform .12s; display: inline-flex; align-items: center; gap: 8px;
  }
  .edu-btn:hover { background: var(--yellow-600); }
  .edu-btn:active { transform: scale(.96); }
  .edu-btn-ghost {
    font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line); box-shadow: none;
  }
  .edu-btn-ghost:hover { background: var(--paper-2); color: var(--ink); }
  .edu-btn[hidden] { display: none; }

  .modal-body { padding: 0; overflow: auto; flex: 1; }

  .preview-note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding: 12px 26px 0; }

  /* CSV / XLSX table preview */
  .tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r-md); margin: 0 26px 26px; }
  table.preview { border-collapse: collapse; width: 100%; font-family: var(--font-sans); font-size: 13px; }
  table.preview th { position: sticky; top: 0; background: var(--paper-3); color: var(--ink); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; text-align: left; padding: 9px 12px; white-space: nowrap; border-bottom: 1px solid var(--line-2); }
  table.preview td { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  table.preview tr:last-child td { border-bottom: none; }
  table.preview tr:nth-child(even) td { background: var(--paper-2); }

  /* text preview */
  pre.txt-preview {
    margin: 0 26px 26px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
    color: var(--ink); white-space: pre-wrap; word-break: break-word; max-height: 52vh; overflow: auto;
  }

  /* pdf preview */
  .pdf-frame { width: 100%; height: 60vh; border: 1px solid var(--line); border-radius: var(--r-md); display: block; }
  .pdf-wrap { padding: 0 26px 26px; }

  /* image preview */
  .img-wrap { padding: 0 26px 26px; }
  .img-preview { display: block; max-width: 100%; max-height: 60vh; margin: 0 auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper-2); }

  /* info block (solid colour) */
  .info-panel { margin: 0 26px 26px; padding: 22px 24px; background: var(--blue-soft); border-radius: var(--r-xl); color: var(--blue-ink); }
  .info-panel h4 { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0 0 8px; color: inherit; }
  .info-panel p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; margin: 0; color: inherit; }

  /* task file list (robimy) */
  .file-list { margin: 0 26px 26px; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .file-list-head { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink); background: var(--paper-3); padding: 9px 14px; border-bottom: 1px solid var(--line-2); }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .file-row:last-child { border-bottom: none; }
  .file-row:nth-child(even) { background: var(--paper-2); }
  .file-path { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink); word-break: break-all; }
  .file-size { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .file-dl { font-family: var(--font-sans); font-weight: 600; font-size: 12px; color: var(--ink); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px 10px; white-space: nowrap; transition: background-color .15s; }
  .file-dl:hover { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); }

  .loader { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); padding: 40px 26px; text-align: center; }

  footer.edu-foot { max-width: 1600px; margin: 0 auto; padding: 20px clamp(16px, 2.5vw, 40px); border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer.edu-foot a { color: var(--ink-2); text-decoration: underline; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 768px) {
    .cat-head { flex-wrap: wrap; }
    .cat-action { margin-left: 0; }
    main { padding-top: 24px; }
    .modal-head, .modal-actions { padding-left: 18px; padding-right: 18px; }
    .tbl-wrap, pre.txt-preview, .info-panel, .file-list { margin-left: 18px; margin-right: 18px; }
    .pdf-wrap, .img-wrap { padding-left: 18px; padding-right: 18px; }
    .preview-note { padding-left: 18px; }
  }
</style>

// ─── Helpers ───
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const fmtSize = n => n < 1024 ? `${n} B` : n < 1024*1024 ? `${Math.round(n/1024)} KB` : `${(n/1024/1024).toFixed(1).replace(".", ",")} MB`;
const taskFiles = key => ROBIMY[key] || [];
const taskSize  = key => taskFiles(key).reduce((a, x) => a + x.s, 0);
const baseName  = p => p.split("/").pop();
const pluralFiles = n => n === 1 ? "plik" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? "pliki" : "plików";
const countFiles = cat => FILES.filter(x => x.cat === cat).reduce((a, x) => a + (x.kind === "task" ? taskFiles(x.task).length : x.zipOf ? 0 : 1), 0);

function itemMeta(it) {
  if (it.kind === "task") { const n = taskFiles(it.task).length; return [`${n} ${pluralFiles(n)}`, fmtSize(taskSize(it.task))]; }
  return it.meta || [];
}

    b.type = "button";
    b.textContent = c === "all" ? "Wszystkie" : (CAT[c].short || CAT[c].label);
    b.setAttribute("aria-pressed", String(c === activeCat));
    b.dataset.cat = c;
    b.onclick = () => { activeCat = c; buildFilters(); renderSections(); liveEl.textContent = `Filtr: ${b.textContent}`; };
    filtersEl.appendChild(b);
  });
}

function renderSections() {
  sectionsEl.innerHTML = "";
  Object.keys(CAT).forEach(catKey => {
    if (activeCat !== "all" && activeCat !== catKey) return;
    const items = FILES.filter(x => x.cat === catKey);
    if (!items.length) return;
    const n = countFiles(catKey);
    const sec = document.createElement("section");
    sec.className = "cat-section";
    sec.dataset.cat = catKey;
    sec.innerHTML = `<div class="cat-head">
        <h2 class="cat-title">${esc(CAT[catKey].label)}</h2>
        <span class="cat-count">${n} ${pluralFiles(n)}</span>
        ${CAT[catKey].zip ? `<a class="edu-btn cat-action" href="${RAW + encPath(CAT[catKey].zip)}" download data-zip="${esc(CAT[catKey].zip)}">↓ Pobierz cały pakiet (ZIP)</a>` : ""}
      </div>${CAT[catKey].desc ? `<p class="cat-desc">${esc(CAT[catKey].desc)}</p>` : ""}<div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    items.forEach(it => grid.appendChild(makeCard(it)));
    sectionsEl.appendChild(sec);
  });
}

function makeCard(it) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card";
  card.dataset.file = it.f;
  card.dataset.kind = it.kind;
  card.onclick = () => openModal(it);
  const nameLine = it.title
    ? `<div class="card-title">${esc(it.title)}</div><div class="card-name">${esc(baseName(it.f))}${it.kind === "task" ? "/" : ""}</div>`
    : `<div class="card-name">${esc(baseName(it.f))}</div>`;
  card.innerHTML = `
    <div class="card-head ${CAT[it.cat].head}">
      <span class="card-chip">${esc(it.kind === "task" ? "zadanie" : it.kind)}</span>
      <span class="card-glyph">${esc(it.glyph)}</span>
      <span class="card-glyph-ghost" aria-hidden="true">${esc(it.glyph)}</span>
    </div>
    <div class="card-body">
      ${nameLine}
      <p class="card-blurb">${esc(it.blurb)}</p>
      <div class="card-meta">${itemMeta(it).map(m => `<span>${esc(m)}</span>`).join("")}</div>
    </div>`;
  return card;
}

// ─── Modal + previews ───
function openModal(it) {
  const isTask = it.kind === "task";
  mCat.textContent = CAT[it.cat].label;
  mName.textContent = it.title || it.f;
  mName.classList.toggle("is-display", Boolean(it.title));
  mBlurb.textContent = it.blurb;
  mMeta.innerHTML = itemMeta(it).map(m => `<span>${esc(m)}</span>`).join("");
  if (isTask) {
    mDownload.hidden = true;
    mDownload.removeAttribute("href");
    mRaw.href = TREE + encPath(it.f);
    mRaw.textContent = "Otwórz folder na GitHubie";
  } else {
    mDownload.hidden = false;
    mDownload.href = RAW + encPath(it.f);
    mRaw.href = BLOB + encPath(it.f);
    mRaw.textContent = "Otwórz na GitHubie";
  }
  mBody.innerHTML = `<div class="loader">Wczytywanie podglądu…</div>`;
  overlay.classList.add("open");
  overlay.dataset.file = it.f;
  if (location.hash !== "#file=" + encodeURIComponent(it.f)) history.replaceState(null, "", "#file=" + encodeURIComponent(it.f));
  document.body.style.overflow = "hidden";
  mClose.focus();
  renderPreview(it);
}

function closeModal() {
  overlay.classList.remove("open");
  delete overlay.dataset.file;
  if (location.hash) history.replaceState(null, "", location.pathname);
  document.body.style.overflow = "";
  mBody.innerHTML = "";
  revokePdf();
}

async function renderPreview(it) {
  try {
    if (it.kind === "csv")  return await previewCSV(it);
    if (it.kind === "txt")  return await previewTXT(it);
    if (it.kind === "xlsx") return await previewXLSX(it);
    if (it.kind === "pdf")  return await previewPDF(it);
    if (it.kind === "png")  return previewIMG(it);
    if (it.kind === "zip")  return previewZIP(it);
    if (it.kind === "task") return await previewTask(it);
  } catch (err) {
    mBody.innerHTML = `<div class="loader">Nie udało się wczytać podglądu.<br>Użyj przycisku „Pobierz plik”. (${esc(err)})</div>`;
  }
}

function parseCSV(text, maxRows) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; if (maxRows && rows.length >= maxRows) break; }
      else if (c === "\r") {}
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function fetchText(path) {
  const res = await fetch(RAW + encPath(path));
  if (!res.ok) throw new Error(res.status);
  return res.text();
}

async function previewCSV(it) {
  const text = await fetchText(it.f);
  const totalLines = text.split("\n").filter(l => l.trim()).length;
  const rows = parseCSV(text, TABLE_ROWS);
  renderTable(rows, `Podgląd: ${Math.min(rows.length-1, TABLE_ROWS-1)} z ${totalLines-1} wierszy danych`);
}

function ensureXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = XLSX_CDN;
    s.onload = resolve;
    s.onerror = () => reject(new Error("nie udało się wczytać biblioteki XLSX"));
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

async function previewXLSX(it) {
  await ensureXLSX();
  const res = await fetch(RAW + encPath(it.f));
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });
  const total = rows.length;
  renderTable(rows.slice(0, TABLE_ROWS).map(r => r.map(c => c == null ? "" : String(c))),
    `Arkusz „${wb.SheetNames[0]}” · podgląd ${Math.min(total-1, TABLE_ROWS-1)} z ${total-1} wierszy`);
}

function renderTable(rows, note) {
  if (!rows.length) { mBody.innerHTML = `<div class="loader">Brak danych do wyświetlenia.</div>`; return; }
  const head = rows[0], body = rows.slice(1);
  let html = `<div class="preview-note">${esc(note)}</div><div class="tbl-wrap"><table class="preview"><thead><tr>`;
  head.forEach(h => html += `<th>${esc(h)}</th>`);
  html += `</tr></thead><tbody>`;
  body.forEach(r => {
    html += "<tr>";
    head.forEach((_, i) => html += `<td>${esc(r[i] ?? "")}</td>`);
    html += "</tr>";
  });
  html += `</tbody></table></div>`;
  mBody.innerHTML = html;
}

function textBlock(text, label) {
  const shown = text.slice(0, TXT_LIMIT);
  const note = text.length > TXT_LIMIT
    ? `${label}: podgląd pierwszych ${TXT_LIMIT.toLocaleString("pl")} znaków z ${text.length.toLocaleString("pl")}`
    : `${label} (${text.length.toLocaleString("pl")} znaków)`;
  return `<div class="preview-note">${esc(note)}</div><pre class="txt-preview">${esc(shown)}${text.length > TXT_LIMIT ? "\n\n… (pobierz plik, aby zobaczyć całość)" : ""}</pre>`;
}

async function previewTXT(it) {
  const text = await fetchText(it.f);
  mBody.innerHTML = textBlock(text, "Pełna zawartość");
}

function revokePdf() { if (pdfObjectUrl) { URL.revokeObjectURL(pdfObjectUrl); pdfObjectUrl = null; } }

async function previewPDF(it) {
  const res = await fetch(RAW + encPath(it.f));
  if (!res.ok) throw new Error(res.status);
  const blob = await res.blob();
  revokePdf();
  pdfObjectUrl = URL.createObjectURL(blob.slice(0, blob.size, "application/pdf"));
  mBody.innerHTML = `<div class="preview-note">Podgląd PDF · ${esc(it.f)}</div>
    <div class="pdf-wrap"><iframe class="pdf-frame" src="${pdfObjectUrl}#toolbar=1" title="${esc(it.f)}"></iframe></div>`;
}

function previewIMG(it) {
  mBody.innerHTML = `<div class="preview-note">Podgląd obrazu · ${esc(baseName(it.f))}</div>
    <div class="img-wrap"><img class="img-preview" src="${RAW + encPath(it.f)}" alt="${esc(it.blurb)}"></div>`;
}

function previewZIP(it) {
  if (it.zipOf) {
    const n = Object.values(ROBIMY).reduce((a, v) => a + v.length, 0);
    mBody.innerHTML = `<div class="info-panel edu-block">
      <h4>Archiwum ZIP</h4>
      <p>Plik <strong>${esc(it.f)}</strong> zawiera cały folder <code>robimy/</code>: ${n} ${pluralFiles(n)}, instrukcję „Zacznij tutaj”, spis plików oraz dziewięć zadań z danymi startowymi. Pobierz i rozpakuj lokalnie. Podgląd zawartości ZIP nie jest dostępny w przeglądarce.</p>
    </div>`;
    return;
  }
  mBody.innerHTML = `<div class="info-panel edu-block">
    <h4>Archiwum ZIP</h4>
    <p>Plik <strong>${esc(it.f)}</strong> zawiera 16 zdjęć kotów (<code>pic/*.jpg</code>). Pobierz archiwum, aby rozpakować obrazy lokalnie. Podgląd zawartości ZIP nie jest dostępny w przeglądarce.</p>
  </div>`;
}

async function previewTask(it) {
  const files = taskFiles(it.task);
  const zadanie = `robimy/${it.task}/ZADANIE.txt`;
  let html = "";
  try { html += textBlock(await fetchText(zadanie), "ZADANIE.txt"); }
  catch (e) { html += `<div class="preview-note">Nie udało się wczytać ZADANIE.txt (${esc(e)})</div>`; }
  html += `<div class="file-list"><div class="file-list-head">Pliki zadania · ${files.length} ${pluralFiles(files.length)} · ${esc(fmtSize(taskSize(it.task)))}</div>`;
  files.forEach(x => {
    const rel = x.p.slice(it.task.length + 1);
    html += `<div class="file-row">
      <span class="file-path">${esc(rel)}</span>
      <span class="file-size">${esc(fmtSize(x.s))}</span>
      <a class="file-dl" href="${RAW + encPath("robimy/" + x.p)}" download="${esc(baseName(x.p))}">Pobierz</a>
    </div>`;
  });
  html += `</div>`;
  mBody.innerHTML = html;
}

// ─── Listeners ───
mClose.onclick = closeModal;
overlay.onclick = e => { if (e.target === overlay) closeModal(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (overlay.classList.contains("open") || e.target.matches("input, textarea")) return;
  const idx = parseInt(e.key, 10);
  if (!Number.isNaN(idx) && idx >= 0 && idx <= Object.keys(CAT).length) {
    const cats = ["all", ...Object.keys(CAT)];
    activeCat = cats[idx]; buildFilters(); renderSections();
  }
});

// ─── Init ───
buildFilters();
renderSections();
function openFromHash() {
  const m = location.hash.match(/^#file=(.+)$/);
  if (!m) return;
  const it = FILES.find(x => x.f === decodeURIComponent(m[1]));
  if (it) openModal(it);
}
window.addEventListener("hashchange", openFromHash);
openFromHash();
</script>
</body>
</html>
